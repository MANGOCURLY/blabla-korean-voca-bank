<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- CSP: GitHub Pages는 커스텀 HTTP 헤더를 못 쓰므로 meta 태그로 넣는다.
     meta 방식은 report-only 가 없어서, 여기 빠진 출처는 곧바로 기능이 죽는다.
     외부 출처를 추가할 때는 반드시 콘솔에서 위반 0건을 확인하고 커밋할 것. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' https://www.gstatic.com https://apis.google.com;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  img-src 'self' data: blob:;
  font-src 'self' https://fonts.gstatic.com;
  connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://docs.google.com https://*.googleusercontent.com;
  frame-src https://vocabank-db55a.firebaseapp.com https://accounts.google.com https://apis.google.com;
  object-src 'none';
  base-uri 'self';
  form-action 'none'
">
<title>Blabla Korea · Voca Bank 🌶️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Blabla Korea 브랜드 토큰 (blablakorea.fr · 2026-08-25 확정)
   라이트 한 장뿐이다. [data-theme] 토글도, 다크 팔레트도 두지 않는다.
   ===================================================================== */
:root{
  color-scheme: light;

  --bg:             #F5ECE9;   /* fond rose ivoiré — 앱 바탕 */
  --bg-grad-1:      #F7F2EC;   /* fond crème */
  --bg-grad-2:      #F3F1F2;   /* fond ivoire froid */
  --surface:        #FFFFFF;   /* 카드 면 */
  --surface-raised: #F7F2EC;   /* 올라온 면 */
  --surface-sunken: #F3F1F2;   /* 움푹한 면 (입력·보기) */

  --text:           #39343D;   /* dark grey — 본문 */
  --text-muted:     #5A535C;   /* dark grey를 읽히게 밝힌 값. #DAD7DB 는 글자로 쓰지 않는다 */
  --text-inverse:   #FFFFFF;

  --border:         #DAD7DB;   /* light grey — 테두리 전용 */
  --shadow:         0 18px 40px -18px rgba(61,0,34,.18);

  --accent:         #A25379;   /* rose — 큰 버튼·강조 */
  --accent-strong:  #3D0022;   /* very dark rose — 제목·작은 글씨 (rose는 흰 배경에서 대비 부족) */
  --accent-contrast:#FFFFFF;

  --success:        #1E7A4C;
  --success-soft:   #E6F4EC;
  --danger:         #B3261E;
  --danger-soft:    #FDECEA;

  --focus-ring:     #A25379;

  /* rgba는 변수 보간이 안 되므로 알파가 필요한 자리는 토큰으로 미리 만든다 */
  --accent-soft:    rgba(162,83,121,.13);
  --accent-veil:    rgba(162,83,121,.34);
  --danger-line:    rgba(179,38,30,.32);
  --danger-veil:    rgba(179,38,30,.40);
  --scrim:          rgba(61,0,34,.22);
  --nav-bg:         rgba(247,242,236,.93);
  --img-shadow:     drop-shadow(0 12px 22px rgba(61,0,34,.16));
  --tag-custom-bg:  rgba(107,92,214,.14);
  --tag-custom-fg:  #4B3FC4;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Poppins,"Segoe UI",-apple-system,system-ui,sans-serif;
  background:
    radial-gradient(1000px 620px at 92% 2%, var(--accent-soft), transparent 58%),
    radial-gradient(1200px 700px at 80% -10%, var(--bg-grad-1), transparent 60%),
    radial-gradient(900px 600px at -10% 110%, var(--bg-grad-2), transparent 55%),
    var(--bg);
  color:var(--text);
  min-height:100%;
  overflow-x:hidden;
}
/* 한국어 본문은 시스템 폰트 — Poppins / Libre Baskerville 은 한글을 못 그린다 */
.kr{font-family:"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif}

.wrap{max-width:640px;margin:0 auto;padding:20px 18px 90px;position:relative}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px}
.brand .dot{font-size:1.4rem;filter:drop-shadow(0 2px 3px var(--accent-soft))}
.brand small{display:block;font-family:"Libre Baskerville",Georgia,serif;font-weight:700;font-size:.62rem;
  color:var(--accent-strong);letter-spacing:2px;text-transform:uppercase}
.bank-chip{
  display:flex;align-items:center;gap:7px;background:linear-gradient(180deg,var(--surface-raised),var(--surface));
  border:1px solid var(--border);border-radius:999px;padding:7px 13px;box-shadow:var(--shadow);
  font-variant-numeric:tabular-nums;font-weight:800;color:var(--accent-strong)
}
.bank-chip .coin{font-size:1rem}
.bank-chip .delta{font-size:.72rem;font-weight:700;opacity:0;transition:.3s;margin-left:2px}
.bank-chip .delta.up{color:var(--success);opacity:1}
.bank-chip .delta.down{color:var(--danger);opacity:1}

/* ---------- cards / buttons ---------- */
.card{background:linear-gradient(180deg,var(--surface),var(--surface-raised));border:1px solid var(--border);
  border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.btn{appearance:none;border:none;cursor:pointer;font-family:inherit;font-weight:700;
  border-radius:14px;padding:14px 18px;font-size:1rem;transition:transform .12s,box-shadow .2s,background .2s;
  width:100%;color:var(--accent-contrast);background:var(--accent);box-shadow:0 8px 18px -8px var(--accent-veil)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn.secondary{background:var(--surface-raised);color:var(--text);box-shadow:none;border:1px solid var(--border)}
.btn.ghost{background:transparent;color:var(--text-muted);box-shadow:none;border:1px solid var(--border)}
.btn.chili{background:var(--danger);color:var(--text-inverse);box-shadow:0 8px 18px -8px var(--danger-veil)}
.btn-row{display:flex;gap:10px;margin-top:12px}
.btn-row .btn{width:auto;flex:1}

.hidden{display:none!important}

/* 진도 저장 잠금(서버 연결 실패) 안내 배너 */
.save-warning{background:var(--danger-soft);border:1px solid var(--danger-line);color:var(--danger);
  border-radius:12px;padding:11px 14px;font-size:.82rem;line-height:1.5;margin-bottom:14px}

/* ---------- login ---------- */
.login{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.login img{width:190px;filter:var(--img-shadow);animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.login h1{font-family:"Libre Baskerville",Georgia,serif;font-size:1.9rem;line-height:1.25;margin-top:6px;color:var(--accent-strong)}
.login h1 span{color:var(--accent)}
.login p{color:var(--text-muted);max-width:340px;margin:4px 0 22px}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#3c4043;
  border:1px solid var(--border);border-radius:14px;padding:14px 20px;font-weight:700;font-size:1rem;cursor:pointer;
  box-shadow:0 10px 24px -12px var(--scrim);transition:transform .12s;width:100%;max-width:320px}
.google-btn:hover{transform:translateY(-2px)}
.google-btn svg{width:20px;height:20px}
/* 게스트 체험 (v3 §5) */
.guest-btn{width:100%;max-width:320px;margin-top:12px}
.guest-hint{margin-top:8px;font-size:.78rem;color:var(--text-muted)}
.guest-note{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);
  border:1px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:14px;
  font-size:.84rem;color:var(--text-muted)}
.guest-note span{flex:1;min-width:150px}
.guest-note .btn{width:auto;flex:none;padding:9px 14px;font-size:.82rem}
.demo-hint{margin-top:14px;font-size:.78rem;color:var(--text-muted)}
.demo-pick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.demo-pick button{background:var(--surface-raised);border:1px solid var(--border);color:var(--text);
  border-radius:999px;padding:7px 13px;font-size:.8rem;cursor:pointer;font-family:inherit}
.demo-pick button:hover{border-color:var(--accent)}
.lang-toggle{position:absolute;top:20px;right:18px;display:inline-flex;align-items:center;gap:5px;
  background:var(--surface-raised);border:1px solid var(--border);border-radius:999px;padding:6px 12px;
  font-size:.72rem;font-weight:700;color:var(--text-muted);cursor:pointer;font-family:inherit;
  letter-spacing:.5px;transition:.15s;z-index:1}
.lang-toggle:hover{border-color:var(--accent);color:var(--accent-strong)}

/* ---------- home ---------- */
.hello{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.hello img{width:74px;flex:none}
.hello h2{font-size:1.3rem;color:var(--accent-strong)}
.hello .sub{color:var(--text-muted);font-size:.85rem;margin-top:2px}

.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat{background:var(--surface-raised);border:1px solid var(--border);border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;transition:transform .12s,border-color .2s}
.stat:hover{transform:translateY(-2px);border-color:var(--accent)}
.stat b{display:block;font-size:1.5rem;color:var(--accent-strong);font-variant-numeric:tabular-nums}
.stat span{font-size:.68rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}

.section-title{font-size:.72rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent-strong);
  margin:22px 2px 10px;font-weight:800}

.menu-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--border);border-radius:16px;padding:16px;cursor:pointer;color:var(--text);
  font-family:inherit;transition:transform .12s,border-color .2s;margin-bottom:10px}
.menu-btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.menu-btn .emoji{font-size:1.6rem;flex:none;width:30px;text-align:center}
.menu-btn .mtext{flex:1}
.menu-btn .mtext b{display:block;font-size:1.02rem;margin-bottom:2px}
.menu-btn .mtext span{font-size:.8rem;color:var(--text-muted)}
.menu-btn .arrow{color:var(--text-muted);font-size:1.2rem}
.menu-btn .badge{background:var(--accent);color:var(--accent-contrast);border-radius:999px;font-size:.72rem;font-weight:800;
  padding:2px 9px;flex:none}

/* ---------- date list ---------- */
.day-block{margin-bottom:14px}
.day-head{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--accent-strong);margin:16px 2px 8px;font-size:.95rem}
.day-head .count{font-size:.72rem;color:var(--text-muted);font-weight:600}
.word-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:12px 14px;margin-bottom:7px}
.word-row .ko{font-weight:800;font-size:1.05rem;min-width:0;overflow-wrap:anywhere;word-break:break-word}
.word-row .mean{color:var(--text-muted);flex:1;min-width:0;font-size:.9rem;overflow-wrap:anywhere;word-break:break-word}
.word-row .tag{font-size:.62rem;padding:3px 8px;border-radius:999px;flex:none;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.tag.new{background:var(--success-soft);color:var(--success)}
.tag.known{background:var(--accent-soft);color:var(--accent-strong)}
.tag.master{background:var(--accent);color:var(--accent-contrast)}
.tag.custom{background:var(--tag-custom-bg);color:var(--tag-custom-fg)}
.word-del{background:none;border:none;color:var(--text-muted);font-size:1rem;cursor:pointer;
  flex:none;padding:4px 6px;border-radius:8px;transition:.15s;line-height:1}
.word-del:hover{color:var(--danger);background:var(--danger-soft)}
.tag.sentence{background:var(--danger-soft);color:var(--danger)}

/* ---------- quiz ---------- */
.quiz-top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.progress{flex:1;height:9px;background:var(--surface-sunken);border:1px solid var(--border);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-strong));width:0;transition:width .4s}
.streak{display:flex;align-items:center;gap:4px;font-weight:800;color:var(--accent-strong);font-size:.95rem;min-width:44px;justify-content:flex-end}
.streak.off{color:var(--text-muted);opacity:.5}
.q-count{font-size:.78rem;color:var(--text-muted);text-align:center;margin-bottom:16px}

.prompt{text-align:center;padding:12px 6px 6px}
.prompt .plabel{font-size:.72rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:12px}
.prompt .pword{font-size:2.3rem;font-weight:800;line-height:1.15;color:var(--accent-strong)}
.prompt .pword.sentence{font-size:1.5rem}
.prompt .pron{color:var(--accent-strong);font-size:1rem;margin-top:8px;font-weight:600}
.pron-toggle{appearance:none;cursor:pointer;font-family:inherit;margin-top:10px;
  width:30px;height:30px;border-radius:999px;font-size:.8rem;font-weight:700;
  background:var(--surface-sunken);border:1px solid var(--border);color:var(--text-muted);
  display:inline-flex;align-items:center;justify-content:center;transition:.15s}
.pron-toggle:hover{border-color:var(--accent);color:var(--accent-strong)}
.pron-toggle.active{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast)}

.options{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.opt{width:100%;text-align:left;background:var(--surface-sunken);border:2px solid var(--border);border-radius:14px;
  padding:16px 18px;font-size:1.05rem;font-weight:600;color:var(--text);cursor:pointer;font-family:inherit;
  transition:transform .1s,border-color .15s,background .15s;display:flex;align-items:center;gap:12px}

.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .mark{width:22px;flex:none;font-weight:900;font-size:1.2rem}
.opt.correct{background:var(--success-soft);border-color:var(--success);color:var(--success)}
.opt.correct .mark{color:var(--success)}
.opt.wrong{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.opt.wrong .mark{color:var(--danger)}

/* feedback illustration overlay */
.feedback{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:40;pointer-events:none;opacity:0;transition:opacity .2s;background:var(--scrim);backdrop-filter:blur(2px)}
.feedback.show{opacity:1}
.feedback img{width:230px;filter:var(--img-shadow);animation:pop .4s cubic-bezier(.2,1.3,.5,1)}
@keyframes pop{0%{transform:scale(.5) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.feedback .fmsg{margin-top:6px;font-size:1.5rem;font-weight:800}
.feedback .fmoney{font-size:1.1rem;font-weight:800;margin-top:2px;color:var(--accent-strong)}
.fmsg.good{color:var(--success)}
.fmsg.bad{color:var(--danger)}

/* =====================================================================
   🧠 단어 복습 (플래시카드)
   ===================================================================== */
.flash-wrap{perspective:1200px;margin:10px 0 4px}
.flash{position:relative;width:100%;min-height:230px;cursor:pointer;
  transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.1,.3,1)}
.flash.flipped{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  border-radius:20px;padding:26px 20px;text-align:center;border:1px solid var(--border);
  box-shadow:var(--shadow)}
.flash .front{background:linear-gradient(180deg,var(--surface),var(--surface-raised))}
.flash .back{transform:rotateY(180deg);
  background:linear-gradient(180deg,var(--surface-raised),var(--bg));border-color:var(--accent-veil)}
.flash .ftext{font-size:2rem;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.flash .ftext.long{font-size:1.4rem}
.flash .fside{font-size:.66rem;text-transform:uppercase;letter-spacing:1.6px;color:var(--text-muted)}
.flash .back .fside{color:var(--accent-strong)}
.flash .fpron{color:var(--accent-strong);font-size:.98rem;font-weight:600}
.flash .fhint{position:absolute;bottom:14px;left:0;right:0;font-size:.72rem;color:var(--text-muted);opacity:.8}
.flash .fstatus{position:absolute;top:14px;right:14px;font-size:.62rem;padding:3px 9px;border-radius:999px;
  font-weight:700;text-transform:uppercase;letter-spacing:.5px}

.flash-nav{display:flex;align-items:center;gap:10px;margin-top:16px}
.flash-nav .btn{flex:1;width:auto}
.flash-nav .navbtn{flex:none;width:52px;padding:14px 0;font-size:1.1rem}
.flash-count{text-align:center;font-size:.78rem;color:var(--text-muted);margin-top:12px;
  font-variant-numeric:tabular-nums}
.flash-dots{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;margin-top:10px}
.flash-dots i{width:6px;height:6px;border-radius:999px;background:var(--border);transition:.2s}
.flash-dots i.seen{background:var(--accent-veil)}
.flash-dots i.now{background:var(--accent);transform:scale(1.6)}

@media (prefers-reduced-motion: reduce){ .flash{transition:none} }

/* 정답 카드 (v3 §3.5) — 정답이든 오답이든 문항 뒤에 항상 뜬다 */
.answer-card{text-align:center;margin-top:18px;padding:16px 14px;background:var(--surface);border-radius:14px;border:1px solid var(--border)}
.answer-card .ac-ko{font-size:1.5rem;font-weight:800;line-height:1.25;overflow-wrap:anywhere;color:var(--accent-strong)}
.answer-card .ac-meta{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:6px;flex-wrap:wrap}
.answer-card .ac-pron{color:var(--accent-strong);font-size:.9rem;font-weight:600}
.answer-card .ac-pos{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-strong)}
.answer-card .ac-mean{margin-top:8px;font-size:1rem;color:var(--text);overflow-wrap:anywhere}
.answer-card .ac-ex{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.answer-card .ac-ex-ko{font-size:.95rem;font-weight:600;overflow-wrap:anywhere}
.answer-card .ac-ex-mean{color:var(--text-muted);font-size:.85rem;margin-top:4px;font-style:italic;overflow-wrap:anywhere}

.field{margin-bottom:14px;text-align:left}
.field label{display:block;font-size:.75rem;color:var(--text-muted);margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.field input,.field textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:13px 14px;font-size:1rem;color:var(--text);font-family:inherit}
.field textarea{resize:vertical;line-height:1.6;min-height:120px}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--focus-ring);box-shadow:0 0 0 3px var(--accent-soft)}
.field-error{color:var(--danger);font-size:.8rem;margin:6px 0 12px}
.field-error.hidden{display:none}

/* ---------- result ---------- */
.result{text-align:center;padding:10px 0}
.result img{width:210px;filter:var(--img-shadow);animation:pop .5s cubic-bezier(.2,1.3,.5,1)}
.result h2{font-size:1.8rem;margin:10px 0 4px;color:var(--accent-strong)}
.result .score{color:var(--text-muted);margin-bottom:18px}
.result .earned{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(180deg,var(--accent),var(--accent-strong));
  color:var(--accent-contrast);font-weight:800;font-size:1.3rem;border-radius:14px;padding:12px 22px;margin-bottom:20px}

/* bottom nav */
.botnav{position:fixed;left:0;right:0;bottom:0;background:var(--nav-bg);backdrop-filter:blur(10px);
  border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0 10px;z-index:20}
.botnav button{background:none;border:none;color:var(--text-muted);font-family:inherit;font-size:.66rem;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 4px;flex:1;min-width:0}
.botnav button .bi{font-size:1.25rem}
.botnav button.active{color:var(--accent-strong)}

@media(max-width:400px){
  .prompt .pword{font-size:1.9rem}
  .login img{width:150px}
}

@media(max-width:560px){
